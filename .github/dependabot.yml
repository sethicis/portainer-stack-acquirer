version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 */14 * *"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 */14 * *"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"