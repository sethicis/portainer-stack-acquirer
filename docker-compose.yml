services:
  qbit-vpn:
    image: j4ym0/pia-qbittorrent:5.2.1-alpine
    container_name: qbitvpn
    cap_add:
      - NET_ADMIN
    volumes:
      - media-data:/data
      - qbit-config:/config
    init: true
    restart: unless-stopped
    ports:
      - 8888:8888
      # For bitmagnet
      - 3333:3333
    environment:
      - UID=112
      - GID=65536
      - TZ=America/Chicago
      - PORT_FORWARDING=true
      - REGION=Netherlands
      - ALLOW_LOCAL_SUBNET_TRAFFIC=true
      - USER=${PIA_USER}
      - PASSWORD=${PIA_PASSWORD}
    extra_hosts:
      - "postgres:192.168.55.211"
    networks:
      bitmagnet:
        ipv4_address: 192.168.55.222
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: flaresolverr
    environment:
      - PUID=112
      - PGID=65536
      - TZ=Europe/London
      - LOG_LEVEL=info
    ports:
      - 8191:8191
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1
    container_name: radarr
    environment:
      - PUID=112
      - PGID=65536
      - TZ=America/Chicago
      - UMASK=012
    volumes:
      - ${COMPOSE_DIR}/radarr_config:/config
      - media-data:/data
    ports:
      - 7878:7878
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: sonarr
    environment:
      - PUID=112
      - PGID=65536
      - TZ=America/Chicago
      - UMASK=012
    volumes:
      - ${COMPOSE_DIR}/sonarr_config:/config
      - media-data:/data
    ports:
      - 8989:8989
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0
    container_name: prowlarr
    environment:
      - PUID=112
      - PGID=65536
      - TZ=Etc/UTC
    ports:
      - 9696:9696
    volumes:
      - ${COMPOSE_DIR}/prowlarr_config:/config
    restart: unless-stopped
  # AKA seerr
  overseerr:
    image: ghcr.io/seerr-team/seerr:v3.3.0
    # Original name of seerr
    container_name: overseerr
    user: 112:65536
    environment:
      - TZ=America/Chicago
      - LOG_LEVEL=debug
    ports:
      - 5055:5055
    volumes:
      - ${COMPOSE_DIR}/overseerr_config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.16.0
    container_name: maintainerr
    user: 112:65536
    volumes:
      - media-data:/opt/media-data
      - ${COMPOSE_DIR}/maintainerr_config:/opt/data
    ports:
      - 6246:6246
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6
    container_name: bazarr
    environment:
      - PUID=112
      - PGID=65536
      - TZ=Etc/UTC
    volumes:
      - ${COMPOSE_DIR}/bazarr_config:/config
      - media-data:/data
    ports:
      - 6767:6767
    restart: unless-stopped
