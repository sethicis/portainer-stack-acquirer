networks:
  bitmagnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.55.0/24
          gateway: 192.168.55.1
volumes:
  media-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_HOST},rw,soft,nolock,nfsvers=4"
      device: ":/volume1/content/data"
  qbit-config: {}
